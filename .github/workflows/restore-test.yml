name: Backup → Restore Test

on:
  workflow_dispatch:
  schedule:
    # Lundi 04:00 UTC — valide que la restauration fonctionne encore
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: restore-test
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  restore-test:
    name: backup → DB vierge → restore → verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rappel_beaute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rappel_beaute"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rappel_beaute?schema=public
      RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rappel_beaute_restore?schema=public
      SESSION_SECRET: restore-test-session-secret-min-32-chars
      ENCRYPTION_KEY: restore-test-encryption-key-32chars!!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Client major = service Postgres (17) — évite échec custom-format dump/restore
      - name: PostgreSQL client 17 (pg_dump / pg_restore)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
          pg_restore --version

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed

      - name: Backup (.dump)
        run: npm run ops:backup

      - name: Créer base vierge pour restore
        run: |
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS rappel_beaute_restore;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE rappel_beaute_restore;"

      - name: Restore
        run: |
          DUMP=$(cat backups/LATEST)
          test -f "backups/$DUMP"
          CONFIRM=yes DATABASE_URL="$RESTORE_DATABASE_URL" npx tsx scripts/ops/restore.ts "backups/$DUMP"
        # restore.ts tolère les warnings pg_restore (--no-owner) puis vérifie Organization

      - name: Migrations post-restore
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}

      - name: Vérifier intégrité
        run: npm run ops:verify-restore
        env:
          DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}

      - name: Tests sur base restaurée
        run: npm run test:security && npm run test:subscriptions
        env:
          DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}

      - name: Preuve restore (artifact)
        if: success()
        run: |
          mkdir -p artifacts
          {
            echo "restore_test=ok"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "dump=$(cat backups/LATEST)"
            echo "source_db=rappel_beaute"
            echo "target_db=rappel_beaute_restore"
            CONFIRM=yes DATABASE_URL="$RESTORE_DATABASE_URL" npx tsx scripts/ops/verify-restore.ts | tee artifacts/verify-restore.json
          } > artifacts/restore-proof.txt
          ls -la backups/
          cp backups/LATEST artifacts/LATEST.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: restore-test-proof
          path: artifacts/
          retention-days: 30

      - name: Alerte si échec (staging)
        if: failure() && vars.ALERT_ON_RESTORE_FAIL == 'true'
        run: |
          if [ -n "${{ secrets.ALERT_WEBHOOK_URL }}" ]; then
            curl -sf -X POST "${{ secrets.ALERT_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{"severity":"critical","title":"Restore test CI échoué","source":"github-actions/restore-test"}'
          fi

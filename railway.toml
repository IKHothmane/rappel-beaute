# Railway — Rappel Beauté (Node.js, pas Workers)
# https://docs.railway.app/guides/deployments

[build]
builder = "nixpacks"
# Nixpacks exécute déjà `npm ci` en phase install — ne pas le relancer (EBUSY sur .cache)
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
# Migrations avant chaque déploiement — jamais prisma db push en staging/prod
releaseCommand = "npx prisma migrate deploy"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

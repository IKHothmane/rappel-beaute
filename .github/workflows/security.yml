# Analyses de sécurité automatiques (dépôt public) :
#  - CodeQL : analyse statique du code JavaScript/TypeScript (gratuit pour un dépôt public) ;
#  - Gitleaks : recherche de secrets dans les commits poussés ;
#  - Semgrep : règles OWASP / Next.js / React / JWT, résultats dans l'onglet « Security » ;
#  - npm audit : rapport des dépendances vulnérables (informatif, ne bloque pas).
# Les actions sont épinglées par SHA de commit (version en commentaire) : une étiquette peut être déplacée.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # chaque lundi, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:javascript-typescript"

  gitleaks:
    name: Gitleaks (secrets)
    # Analyse les commits envoyés (push, PR) ; l'historique complet se vérifie en local avec « gitleaks git ».
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Compte personnel : aucune licence requise. Pas de commentaire automatique sur les PR.
          GITLEAKS_ENABLE_COMMENTS: "false"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Installer Semgrep (version figée)
        run: python -m pip install --disable-pip-version-check semgrep==1.187.0
      - name: Analyser
        env:
          SEMGREP_SEND_METRICS: "off"
        run: >-
          semgrep scan --metrics=off
          --config p/javascript --config p/typescript --config p/react --config p/nextjs
          --config p/owasp-top-ten --config p/jwt --config p/secrets
          --exclude tests --exclude e2e --exclude public --exclude "prisma/generated"
          --sarif --output semgrep.sarif src scripts next.config.mjs
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  npm-audit:
    name: npm audit (rapport)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Dépendances de production
        # Informatif : Next.js 14 n'a plus de correctif ; la montée de version est suivie à part.
        continue-on-error: true
        run: |
          npm audit --omit=dev --audit-level=high > audit.txt 2>&1 || status=$?
          { echo "## npm audit (production)"; echo '```'; tail -n 40 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

name: Staging

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Verify (same as CI)
    uses: ./.github/workflows/ci.yml

  e2e:
    name: E2E Playwright
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rappel_beaute_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rappel_beaute_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # 127.0.0.1 (pas localhost) : sur les runners GHA, localhost → ::1 et Redis
    # n'écoute souvent qu'en IPv4 → connect hang / health 503 → timeout Playwright.
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rappel_beaute_e2e?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: e2e-staging-session-secret-min-32-chars-long
      ENCRYPTION_KEY: e2e-staging-encryption-key-32chars!!

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NODE_ENV: production

      - name: Démarrer Next.js
        run: |
          set -euo pipefail
          npx next start -H 127.0.0.1 -p 3000 > /tmp/next-e2e.log 2>&1 &
          echo $! > /tmp/next-e2e.pid
          echo "PID=$(cat /tmp/next-e2e.pid)"

          for i in $(seq 1 90); do
            if ! kill -0 "$(cat /tmp/next-e2e.pid)" 2>/dev/null; then
              echo "::error::next start s'est arrêté avant d'être prêt"
              cat /tmp/next-e2e.log
              exit 1
            fi

            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
              --max-time 5 \
              -D /tmp/health.headers \
              http://127.0.0.1:3000/api/health/ || echo "000")
            body=$(cat /tmp/health.json 2>/dev/null || true)
            loc=$(grep -i '^location:' /tmp/health.headers 2>/dev/null | tr -d '\r' || true)
            echo "try=$i http=$code body=$body $loc"

            if [ "$code" = "200" ]; then
              echo "App prête"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Timeout readiness /api/health/ (90×2s)"
          cat /tmp/next-e2e.log
          exit 1
        env:
          NODE_ENV: production

      - name: E2E Playwright
        run: npm run test:e2e
        env:
          CI: true
          NODE_ENV: production
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Logs Next.js (si échec)
        if: failure()
        run: |
          echo "----- next-e2e.log -----"
          cat /tmp/next-e2e.log || true

  deploy-staging:
    name: Deploy to Staging
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: https://app-staging.rappelbeaute.ma

    steps:
      - uses: actions/checkout@v5

      - name: Deploy placeholder
        run: |
          echo "Staging deploy — connectez votre hébergeur (Vercel, Railway, VM…) ici."
          echo "Étapes : build artifact → migrate deploy → start app"
          echo "Secrets via GitHub Environment « staging » — jamais dans le repo."

      - name: Post-deploy migrate (staging only)
        run: echo "npx prisma migrate deploy avec DATABASE_URL du secret staging"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

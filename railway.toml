# Deployment settings for Railway services that still read this file.
# Mirror these settings on the Railway service before the cutover.

[build]
builder = "RAILPACK"
railpackVersion = "0.44.0"

[deploy]
preDeployCommand = ["npx prisma migrate deploy"]
startCommand = "bash scripts/start-prod.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# The signed healthcheck through Cloudflare preserves ORIGIN_SECRET.

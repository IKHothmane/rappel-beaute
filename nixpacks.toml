# Nixpacks — Node 22.12+ requis par Prisma 7 (défaut Nixpacks = Node 18)
# https://nixpacks.com/docs/providers/node

[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x", "openssl"]
# jemalloc : restitue la RSS native après pics Sharp (glibc garde souvent le pic).
aptPkgs = ["libjemalloc2"]
# Node 22.13.1 — commit nixpkgs confirmé Railway/Nixpacks
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
# `npm prune` : retire les devDependencies (vitest, playwright, eslint…) après le build
# pour alléger l'image. Next, Prisma, sharp et tsx sont dans `dependencies`.
cmds = ["npm run build", "npm prune --omit=dev"]

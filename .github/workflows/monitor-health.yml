name: Monitor Health

on:
  workflow_dispatch:
  schedule:
    # Toutes les 15 minutes — brancher sur staging puis production
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  health-check:
    name: Health + alertes
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Vérifier la configuration
        id: config
        env:
          HEALTH_BASE_URL: ${{ vars.HEALTH_BASE_URL }}
        run: |
          if [ -z "$HEALTH_BASE_URL" ]; then
            echo "::warning::HEALTH_BASE_URL n'est pas définie sur l'environnement « staging » (Settings > Environments > staging > Variables). Sondes ignorées."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
        if: steps.config.outputs.ready == 'true'

      - name: Vérifier endpoints
        if: steps.config.outputs.ready == 'true'
        run: npx tsx scripts/ops/monitor-health.ts
        env:
          HEALTH_BASE_URL: ${{ vars.HEALTH_BASE_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          APP_ENV: staging
